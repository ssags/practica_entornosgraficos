<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articulos</title>
    <style>
        body {
            margin: 0;
            font-family: "Times New Roman", serif;
            background: #fff;
        }

        .contenedor {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 1.9rem;
        }
    </style>
</head>
<body>
    <main class="contenedor">
        <h2>Articulos en existencia</h2>
        <table>
            <thead>
                <tr>
                    <th>Articulo</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Cuaderno A4</td>
                    <td>$ 4.500</td>
                </tr>
                <tr>
                    <td>Lapicera azul</td>
                    <td>$ 1.200</td>
                </tr>
                <tr>
                    <td>Mochila escolar</td>
                    <td>$ 24.900</td>
                </tr>
                <tr>
                    <td>Calculadora cientifica</td>
                    <td>$ 31.000</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
