<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ejercitacion 4 - Formularios</title>
</head>
<body>
	<h1>Ejercitación 4 - Formularios</h1>

	<h2>4.A) Campo requerido</h2>
	<form>
		<label for="nombre">Nombre:</label>
		<input type="text" id="nombre" name="nombre" required>
		<button type="submit">Enviar</button>
	</form>

	<h2>4.B) Campo de tipo email</h2>
	<form>
		<label for="correo">Correo electrónico:</label>
		<input type="email" id="correo" name="correo" required>
		<button type="submit">Enviar</button>
	</form>

	<h2>4.C) Campo de tipo fecha</h2>
	<form>
		<label for="fecha">Fecha:</label>
		<input type="date" id="fecha" name="fecha" required>
		<button type="submit">Enviar</button>
	</form>

	<h2>4.D) Campo de tipo color</h2>
	<form>
		<label for="color">Color favorito:</label>
		<input type="color" id="color" name="color" required>
		<button type="submit">Enviar</button>
	</form>

	<h2>4.E) Campo de tipo number con mínimo y máximo</h2>
	<form>
		<label for="edad">Edad (entre 18 y 99):</label>
		<input type="number" id="edad" name="edad" min="18" max="99" required>
		<button type="submit">Enviar</button>
	</form>
</body>
</html>
